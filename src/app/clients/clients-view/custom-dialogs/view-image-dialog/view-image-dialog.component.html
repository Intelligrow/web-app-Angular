<!-- Author: Anirudha Joshi -->
<!-- Description: Dialog for viewing client profile images -->

<h1 mat-dialog-title>{{ 'labels.heading.View Client Image' | translate }}</h1>

<div mat-dialog-content class="image-container">
  <img [src]="data.image" [alt]="data.title" />
</div>

<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close>{{ 'labels.buttons.Close' | translate }}</button>
</mat-dialog-actions>
